name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package metadata
        id: package
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Validate, test and package release
        run: RELEASE_STRICT_CHANGELOG=1 npm run release:ci

      - name: Prepare release notes
        run: node scripts/generate-release-notes.mjs --output=RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          name: 健康档案 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/app.tgz
            dist/fnos-app-health-records-${{ steps.package.outputs.version }}.fpk
