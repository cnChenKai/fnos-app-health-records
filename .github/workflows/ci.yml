name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read package metadata
        id: package
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"
      - run: npm run release:ci
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fnos-app-health-records-${{ steps.package.outputs.version }}-artifacts
          path: |
            dist/app.tgz
            dist/fnos-app-health-records-${{ steps.package.outputs.version }}.fpk
            .fnos-build/package/manifest
            .fnos-build/package/ICON.PNG
          if-no-files-found: error
