name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:ci
      - name: Upload app.tgz artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnos-app-health-records-artifacts
          path: |
            dist/app.tgz
            dist/*.fpk
            .fnos-build/package/manifest
            .fnos-build/package/ICON.PNG
          if-no-files-found: error
