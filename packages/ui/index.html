<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e7c6b" />
    <title>健康档案</title>
    <script>
      try {
        var theme = localStorage.getItem("health-records:theme");
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
        if (dark) {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#151716");
          document.documentElement.style.background = "#151716";
        }
      } catch (error) {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
