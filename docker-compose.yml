services:
  health-records:
    image: docker.io/${DOCKERHUB_IMAGE:-timorm/fnos-app-health-records}:${HEALTH_RECORDS_VERSION:-latest}
    build:
      context: .
      args:
        APP_VERSION: ${HEALTH_RECORDS_VERSION:-local}
        GATEWAY_PREFIX: /
    container_name: fnos-health-records
    restart: unless-stopped
    ports:
      - "${HEALTH_RECORDS_PORT:-3334}:3334"
    environment:
      AUTH_MODE: local
      GATEWAY_PREFIX: /
      LOCAL_ADMIN_DISPLAY_NAME: ${LOCAL_ADMIN_DISPLAY_NAME:-本地管理员}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      IMPORT_ROOTS: /reports
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_HOST_PATH:-health-records-data}:/data
      - ${REPORTS_HOST_PATH:-${IMPORT_HOST_PATH:-./reports}}:/reports:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true

volumes:
  health-records-data:
    name: fnos-health-records-data
